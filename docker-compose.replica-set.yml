# Docker Compose với MongoDB Replica Set
# Sử dụng file này để enable transactions support

version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cafe-pos-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-cafe_pos}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
      - ./mongodb-keyfile:/data/keyfile:ro
    command: >
      mongod 
      --replSet rs0 
      --bind_ip_all 
      --keyFile /data/keyfile
      --auth
    networks:
      - cafe-pos-network
    healthcheck:
      test: |
        mongosh --username ${MONGO_INITDB_ROOT_USERNAME:-admin} --password ${MONGO_INITDB_ROOT_PASSWORD:-password} --authenticationDatabase admin --eval "
        try {
          var status = rs.status();
          if (status.ok === 1) {
            quit(0);
          }
        } catch(e) {
          quit(1);
        }
        " || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  backend:
    image: linhtranphu/cafe-pos-backend:latest
    container_name: cafe-pos-backend
    restart: on-failure
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://admin:password@mongodb:27017/cafe_pos?replicaSet=rs0&authSource=admin}
      - MONGODB_DATABASE=${MONGODB_DATABASE:-cafe_pos}
      - JWT_SECRET=${JWT_SECRET:-your-secret-key}
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - cafe-pos-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/state-machines"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: linhtranphu/cafe-pos-frontend:latest
    container_name: cafe-pos-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - cafe-pos-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  cafe-pos-network:
    driver: bridge
